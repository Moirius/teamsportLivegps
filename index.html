<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPX Race Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { background: #060b14; color: #e2e8f0; font-family: 'Barlow Condensed', sans-serif; }
    body::after {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.4;
    }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
    @keyframes blink  { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

    /* ── Setup ── */
    .setup { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
    .logo { font-size:13px; font-weight:700; letter-spacing:0.25em; color:#06b6d4; text-transform:uppercase; margin-bottom:4px; }
    .title { font-size:42px; font-weight:900; line-height:1; color:#f1f5f9; letter-spacing:-0.01em; margin-bottom:4px; }
    .subtitle { font-size:16px; color:#475569; margin-bottom:32px; }
    .card { background:#0d1626; border:1px solid #1e2d45; border-radius:16px; padding:20px; width:100%; max-width:480px; margin-bottom:16px; }
    .card-label { font-size:11px; font-weight:700; letter-spacing:0.2em; color:#475569; text-transform:uppercase; margin-bottom:12px; }
    .upload-btn { display:flex; align-items:center; gap:12px; background:#111d31; border:1px dashed #1e3a4a; border-radius:10px; padding:14px 16px; cursor:pointer; transition:all 0.2s; width:100%; }
    .upload-btn:hover { background:#162033; border-color:#06b6d4; }
    .upload-name { font-size:14px; font-weight:600; color:#94a3b8; }
    .upload-meta { font-size:12px; color:#06b6d4; font-family:'JetBrains Mono',monospace; }
    .modes { display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; max-width:480px; }
    .mode-btn { background:#0d1626; border:1px solid #1e2d45; border-radius:16px; padding:20px 16px; cursor:pointer; transition:all 0.2s; text-align:left; color:white; font-family:'Barlow Condensed',sans-serif; }
    .mode-btn:hover:not(:disabled) { border-color:#06b6d4; background:#111d31; }
    .mode-btn:disabled { opacity:0.35; cursor:not-allowed; }
    .mode-btn.primary { border-color:#0e4d63; background:#0a1e2e; }
    .mode-btn.primary:hover:not(:disabled) { background:#0d2236; border-color:#06b6d4; }
    .mode-icon { font-size:28px; margin-bottom:8px; display:block; }
    .mode-title { font-size:18px; font-weight:700; display:block; }
    .mode-desc { font-size:12px; color:#475569; margin-top:4px; display:block; letter-spacing:0.05em; }
    .code-input { width:100%; background:#060b14; border:1px solid #1e2d45; border-radius:8px; padding:10px 12px; font-size:20px; font-family:'JetBrains Mono',monospace; font-weight:700; letter-spacing:0.3em; text-align:center; color:#06b6d4; text-transform:uppercase; outline:none; margin:10px 0; transition:border-color 0.2s; }
    .code-input:focus { border-color:#06b6d4; }
    .connect-btn { width:100%; background:#7c3aed; border:none; border-radius:8px; padding:10px; font-size:14px; font-weight:700; font-family:'Barlow Condensed',sans-serif; letter-spacing:0.1em; color:white; cursor:pointer; transition:background 0.2s; text-transform:uppercase; }
    .connect-btn:hover:not(:disabled) { background:#6d28d9; }
    .connect-btn:disabled { opacity:0.35; cursor:not-allowed; }
    .status-msg { font-size:13px; color:#f59e0b; text-align:center; margin-top:12px; }
    .loading-msg { font-size:12px; color:#334155; text-align:center; animation:pulse 2s infinite; }

    /* ── Shared ── */
    .screen { display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:20px; gap:16px; }
    .back-btn { align-self:flex-start; background:none; border:none; color:#334155; font-size:13px; font-family:'Barlow Condensed',sans-serif; letter-spacing:0.1em; cursor:pointer; padding:4px 0; transition:color 0.2s; text-transform:uppercase; }
    .back-btn:hover { color:#64748b; }
    .status-pill { display:flex; align-items:center; gap:10px; background:#0d1626; border-radius:50px; padding:10px 20px; border:1px solid #1e2d45; font-size:14px; font-weight:600; letter-spacing:0.08em; }
    .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .dot.green { background:#22c55e; box-shadow:0 0 8px #22c55e; animation:blink 1.5s infinite; }
    .dot.yellow { background:#f59e0b; animation:blink 2s infinite; }
    .dot.gray { background:#334155; }

    /* ── Régie (host) ── */
    .code-display { background:#0d1626; border:1px solid #1e3a4a; border-radius:16px; padding:24px 32px; text-align:center; width:100%; max-width:340px; }
    .code-label { font-size:10px; letter-spacing:0.3em; color:#334155; text-transform:uppercase; margin-bottom:8px; }
    .code-value { font-size:48px; font-weight:900; font-family:'JetBrains Mono',monospace; color:#06b6d4; letter-spacing:0.2em; line-height:1; }
    .code-hint { font-size:11px; color:#334155; margin-top:8px; letter-spacing:0.1em; }

    /* ── Moto ── */
    .gps-card { background:#0d1626; border:1px solid #1e2d45; border-radius:14px; padding:16px 20px; width:100%; max-width:340px; }
    .gps-label { font-size:10px; letter-spacing:0.3em; color:#334155; text-transform:uppercase; margin-bottom:8px; }
    .gps-coords { font-size:11px; font-family:'JetBrains Mono',monospace; color:#64748b; }
    .gps-acc { font-size:12px; color:#f59e0b; margin-top:4px; }
    .km-local { font-size:28px; font-weight:900; color:#06b6d4; margin-top:8px; }

    /* ── Display / Régie live ── */
    .display { display:flex; flex-direction:column; min-height:100vh; padding:16px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .conn-badge { display:flex; align-items:center; gap:7px; background:#0d1626; border-radius:50px; padding:6px 14px; font-size:12px; letter-spacing:0.12em; color:#64748b; border:1px solid #1e2d45; }
    .race-name { font-size:13px; font-weight:700; letter-spacing:0.2em; color:#334155; text-transform:uppercase; text-align:center; margin-bottom:8px; }
    .km-display { display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; gap:8px; }
    .km-number { font-size:clamp(72px,18vw,128px); font-weight:900; line-height:1; color:#f1f5f9; font-family:'Barlow Condensed',sans-serif; letter-spacing:-0.02em; transition:all 0.3s; }
    .km-unit { font-size:clamp(24px,5vw,36px); font-weight:700; color:#06b6d4; letter-spacing:0.1em; text-transform:uppercase; }
    .km-waiting { font-size:20px; color:#334155; letter-spacing:0.15em; animation:pulse 2s infinite; }
    .progress-wrap { width:100%; max-width:440px; padding:0 4px; }
    .progress-meta { display:flex; justify-content:space-between; font-size:12px; color:#334155; letter-spacing:0.08em; margin-bottom:8px; font-family:'JetBrains Mono',monospace; }
    .progress-bar { height:6px; background:#0d1626; border-radius:3px; overflow:hidden; border:1px solid #1e2d45; }
    .progress-fill { height:100%; background:linear-gradient(90deg,#0e7490,#06b6d4); border-radius:3px; transition:width 0.6s cubic-bezier(0.25,1,0.5,1); box-shadow:0 0 8px #06b6d480; }
    .progress-pct { text-align:right; font-size:11px; color:#1e3a4a; font-family:'JetBrains Mono',monospace; margin-top:5px; letter-spacing:0.1em; }
    .gps-acc-display { font-size:11px; color:#1e3a4a; font-family:'JetBrains Mono',monospace; letter-spacing:0.1em; }

    /* ── vMix mode ── */
    .vmix-root { display:flex; align-items:center; justify-content:center; min-height:100vh; background:transparent; font-family:'Barlow Condensed',sans-serif; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useState, useEffect, useRef } = React;

  // ── Geo math ─────────────────────────────────────────────────────────────
  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  }

  function parseGPX(xml) {
    try {
      const doc = new DOMParser().parseFromString(xml, "text/xml");
      const trkpts = [...doc.querySelectorAll("trkpt")];
      const rtepts = [...doc.querySelectorAll("rtept")];
      const src = trkpts.length > 0 ? trkpts : rtepts;
      if (src.length < 2) return null;
      const pts = src.map(el => ({ lat: parseFloat(el.getAttribute("lat")), lon: parseFloat(el.getAttribute("lon")) }))
                     .filter(p => !isNaN(p.lat) && !isNaN(p.lon));
      let cum = 0;
      return pts.map((p,i) => { if(i>0) cum+=haversine(pts[i-1].lat,pts[i-1].lon,p.lat,p.lon); return {...p,cum}; });
    } catch { return null; }
  }

  function getRemainingKm(track, lat, lon) {
    if (!track?.length) return null;
    let minD = Infinity, idx = 0;
    track.forEach((p,i) => { const d=haversine(lat,lon,p.lat,p.lon); if(d<minD){minD=d;idx=i;} });
    const total = track[track.length-1].cum;
    const a = track[idx], b = track[Math.min(idx+1,track.length-1)];
    const segLen = haversine(a.lat,a.lon,b.lat,b.lon);
    if (segLen > 0.001) {
      const dA=haversine(lat,lon,a.lat,a.lon), dB=haversine(lat,lon,b.lat,b.lon);
      const t=Math.max(0,Math.min(1,(dA**2-dB**2+segLen**2)/(2*segLen**2)));
      return Math.max(0, total-(a.cum+t*segLen));
    }
    return Math.max(0, total-a.cum);
  }

  // ── SVG Track Map ─────────────────────────────────────────────────────────
  function TrackMap({ track, currentPos, compact=false }) {
    if (!track?.length) return null;
    const lats=track.map(p=>p.lat), lons=track.map(p=>p.lon);
    const minLat=Math.min(...lats), maxLat=Math.max(...lats);
    const minLon=Math.min(...lons), maxLon=Math.max(...lons);
    const W=compact?280:360, H=compact?140:190, pad=18, w=W-2*pad, h=H-2*pad;
    const x = lon => pad+((lon-minLon)/(maxLon-minLon||1))*w;
    const y = lat => pad+h-((lat-minLat)/(maxLat-minLat||1))*h;
    const stride = Math.max(1,Math.floor(track.length/400));
    const sampled = track.filter((_,i)=>i%stride===0||i===track.length-1);
    const pathD = sampled.map((p,i)=>`${i===0?"M":"L"}${x(p.lon).toFixed(1)} ${y(p.lat).toFixed(1)}`).join(" ");
    const totalKm = track[track.length-1].cum;
    const done = currentPos ? totalKm-(getRemainingKm(track,currentPos.lat,currentPos.lon)??totalKm) : 0;
    const progressIdx = Math.floor((totalKm>0?done/totalKm:0)*(sampled.length-1));
    const progressPath = sampled.slice(0,progressIdx+1).map((p,i)=>`${i===0?"M":"L"}${x(p.lon).toFixed(1)} ${y(p.lat).toFixed(1)}`).join(" ");
    const cx=currentPos?x(currentPos.lon):null, cy=currentPos?y(currentPos.lat):null;
    return (
      <svg width={W} height={H} style={{borderRadius:12,background:"#080c14",display:"block"}}>
        <defs>
          <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <linearGradient id="pgrd" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stopColor="#06b6d4"/><stop offset="100%" stopColor="#22d3ee"/></linearGradient>
        </defs>
        <path d={pathD} fill="none" stroke="#1e3a4a" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>
        {progressPath && <path d={progressPath} fill="none" stroke="url(#pgrd)" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" filter="url(#glow)"/>}
        <circle cx={x(track[0].lon)} cy={y(track[0].lat)} r={5} fill="#22c55e"/>
        <text x={x(track[0].lon)+7} y={y(track[0].lat)+4} fill="#22c55e" fontSize="9" fontFamily="monospace" fontWeight="bold">START</text>
        <circle cx={x(track[track.length-1].lon)} cy={y(track[track.length-1].lat)} r={5} fill="#f97316"/>
        <text x={x(track[track.length-1].lon)+7} y={y(track[track.length-1].lat)+4} fill="#f97316" fontSize="9" fontFamily="monospace" fontWeight="bold">FIN</text>
        {currentPos && <>
          <circle cx={cx} cy={cy} r={11} fill="#facc15" opacity="0.15"/>
          <circle cx={cx} cy={cy} r={6} fill="#facc15" stroke="#fff" strokeWidth="1.5"/>
        </>}
      </svg>
    );
  }

  // ── vMix Display (mode ?vmix) ─────────────────────────────────────────────
  // Ouvrir cette page dans vMix : index.html?vmix
  // La régie écrit dans localStorage("gpxrace_km"), cette page le lit en temps réel.
  // Les deux pages doivent être ouvertes dans le même navigateur sur la machine régie.
  function VmixDisplay() {
    const [km, setKm] = useState(() => localStorage.getItem('gpxrace_km'));

    useEffect(() => {
      // Réagit instantanément aux mises à jour de la régie via storage event
      const onStorage = e => { if (e.key === 'gpxrace_km') setKm(e.newValue); };
      window.addEventListener('storage', onStorage);
      // Fallback poll toutes les secondes au cas où storage event ne se déclenche pas
      const poll = setInterval(() => setKm(localStorage.getItem('gpxrace_km')), 1000);
      return () => { window.removeEventListener('storage', onStorage); clearInterval(poll); };
    }, []);

    return (
      <div className="vmix-root">
        <span style={{fontSize:96, fontWeight:900, color:'white', lineHeight:1}}>
          {km ?? '---'}
        </span>
        <span style={{fontSize:36, fontWeight:700, color:'#06b6d4', marginLeft:10, lineHeight:1, alignSelf:'flex-end', paddingBottom:8}}>
          km
        </span>
      </div>
    );
  }

  // ── App principal ─────────────────────────────────────────────────────────
  function App() {
    const [screen, setScreen]           = useState("setup");
    const [gpxTrack, setGpxTrack]       = useState(null);
    const [gpxName, setGpxName]         = useState("");
    const [totalKm, setTotalKm]         = useState(0);
    const [sessionCode, setSessionCode] = useState("");
    const [inputCode, setInputCode]     = useState("");
    const [status, setStatus]           = useState("");
    const [connected, setConnected]     = useState(false);
    const [peerReady, setPeerReady]     = useState(false);
    const [currentPos, setCurrentPos]   = useState(null);
    const [remainingKm, setRemainingKm] = useState(null);
    const [accuracy, setAccuracy]       = useState(null);
    const [gpxReceived, setGpxReceived] = useState(false);

    const peerRef       = useRef(null);
    const connRef       = useRef(null);
    const watchRef      = useRef(null);
    const gpxRef        = useRef(null);
    const lastSentRef   = useRef(null);
    const wakeLockRef   = useRef(null);
    const trackIdxRef   = useRef(null);
    const retryTimerRef = useRef(null); // timer de reconnexion automatique

    useEffect(() => { gpxRef.current = gpxTrack; }, [gpxTrack]);

    // Wake Lock : empêche l'écran de se verrouiller en mode moto
    useEffect(() => {
      if (screen !== "moto") return;
      const acquire = async () => {
        try { if ("wakeLock" in navigator) wakeLockRef.current = await navigator.wakeLock.request("screen"); } catch {}
      };
      acquire();
      const onVisible = () => { if (document.visibilityState === "visible") acquire(); };
      document.addEventListener("visibilitychange", onVisible);
      return () => {
        document.removeEventListener("visibilitychange", onVisible);
        wakeLockRef.current?.release().catch(()=>{});
        wakeLockRef.current = null;
      };
    }, [screen]);

    const cleanup = () => {
      if (retryTimerRef.current) { clearTimeout(retryTimerRef.current); retryTimerRef.current = null; }
      if (watchRef.current) { navigator.geolocation.clearWatch(watchRef.current); watchRef.current = null; }
      if (connRef.current)  { try { connRef.current.close();  } catch {} connRef.current = null; }
      if (peerRef.current)  { try { peerRef.current.destroy();} catch {} peerRef.current = null; }
    };
    useEffect(() => cleanup, []);

    const goBack = () => {
      cleanup();
      localStorage.removeItem('gpxrace_moto');
      localStorage.removeItem('gpxrace_moto_idx');
      localStorage.removeItem('gpxrace_km');
      trackIdxRef.current = null;
      setScreen("setup"); setConnected(false); setPeerReady(false);
      setCurrentPos(null); setRemainingKm(null); setStatus("");
      setGpxReceived(false);
    };

    // ── Charger GPX ──────────────────────────────────────────────────────────
    const handleGPX = e => {
      const file = e.target.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = ev => {
        const track = parseGPX(ev.target.result);
        if (!track || track.length < 2) { setStatus("⚠️ GPX invalide ou trop court"); return; }
        setGpxTrack(track);
        setGpxName(file.name.replace(".gpx",""));
        setTotalKm(track[track.length-1].cum);
        setStatus("");
      };
      r.readAsText(file);
    };

    // ── GPS watch (moto) ─────────────────────────────────────────────────────
    const SEND_EVERY_KM = 0.1; // envoie tous les 100m

    const startGPS = () => {
      // Ne démarre qu'une seule fois même après reconnexion PeerJS
      if (watchRef.current !== null) return;
      if (!navigator.geolocation) { setStatus("❌ GPS non disponible"); return; }

      watchRef.current = navigator.geolocation.watchPosition(
        pos => {
          const { latitude:lat, longitude:lon, accuracy:acc } = pos.coords;
          setCurrentPos({ lat, lon });
          setAccuracy(acc);

          const track = gpxRef.current;
          let remaining = null;
          if (track?.length) {
            // Recherche dans une fenêtre glissante : jamais en arrière sur la trace
            const lastIdx = trackIdxRef.current;
            const searchStart = lastIdx !== null ? Math.max(0, lastIdx - 50)                : 0;
            const searchEnd   = lastIdx !== null ? Math.min(track.length - 1, lastIdx + 300) : track.length - 1;
            let minD = Infinity, idx = lastIdx ?? 0;
            for (let i = searchStart; i <= searchEnd; i++) {
              const d = haversine(lat, lon, track[i].lat, track[i].lon);
              if (d < minD) { minD = d; idx = i; }
            }
            trackIdxRef.current = idx;
            localStorage.setItem('gpxrace_moto_idx', String(idx));
            const total = track[track.length-1].cum;
            const a = track[idx], b = track[Math.min(idx+1, track.length-1)];
            const segLen = haversine(a.lat, a.lon, b.lat, b.lon);
            if (segLen > 0.001) {
              const dA = haversine(lat, lon, a.lat, a.lon), dB = haversine(lat, lon, b.lat, b.lon);
              const t = Math.max(0, Math.min(1, (dA*dA - dB*dB + segLen*segLen) / (2*segLen*segLen)));
              remaining = Math.max(0, total - (a.cum + t*segLen));
            } else {
              remaining = Math.max(0, total - a.cum);
            }
          }

          setRemainingKm(remaining);
          const last = lastSentRef.current;
          const moved = last ? haversine(last.lat, last.lon, lat, lon) : Infinity;
          if (moved >= SEND_EVERY_KM && connRef.current?.open) {
            connRef.current.send({ type:"pos", lat, lon, acc, remaining, t:Date.now() });
            lastSentRef.current = { lat, lon };
          }
        },
        err => setStatus(`GPS : ${err.message}`),
        { enableHighAccuracy:true, maximumAge:2000, timeout:15000 }
      );
    };

    // ── RÉGIE : crée le peer, attend la moto ─────────────────────────────────
    const startRegie = () => {
      if (!gpxTrack) { setStatus("⚠️ Chargez un fichier GPX"); return; }
      if (!inputCode.trim()) { setStatus("⚠️ Entrez un nom de session"); return; }
      const code = inputCode.trim().toUpperCase();
      setSessionCode(code);
      setScreen("regie");
      setPeerReady(false); setConnected(false);

      const peer = new Peer(`gpxrace-${code}`);
      peerRef.current = peer;
      peer.on("open", () => { setPeerReady(true); setStatus("En attente de la moto…"); });
      peer.on("connection", conn => {
        // Ferme l'ancienne connexion si la moto se reconnecte
        if (connRef.current) { try { connRef.current.close(); } catch {} }
        connRef.current = conn;
        conn.on("open", () => {
          setConnected(true); setStatus("Moto connectée ✓");
          conn.send({ type:"gpx", track: gpxRef.current, name: gpxName });
        });
        conn.on("data", data => {
          if (data.type === "pos") {
            setCurrentPos({ lat:data.lat, lon:data.lon });
            setAccuracy(data.acc);
            const rem = data.remaining != null
              ? data.remaining
              : getRemainingKm(gpxRef.current, data.lat, data.lon);
            setRemainingKm(rem);
            // Écrit le km restant pour la page vMix (index.html?vmix)
            if (rem != null) localStorage.setItem('gpxrace_km', rem.toFixed(1));
          }
        });
        conn.on("close", () => { setConnected(false); setStatus("Moto déconnectée — en attente de reconnexion…"); });
        conn.on("error", err => setStatus(`Erreur: ${err}`));
      });
      peer.on("error", err => {
        if (err.type === "unavailable-id") setStatus("⚠️ Ce nom de session est déjà utilisé.");
        else setStatus(`Erreur: ${err.type}`);
      });
    };

    // ── MOTO : connexion avec reconnexion automatique silencieuse ────────────
    const startMoto = (codeOverride) => {
      const raw = codeOverride != null ? codeOverride : inputCode;
      if (!raw.trim()) { setStatus("⚠️ Entrez le nom de session"); return; }
      const code = raw.trim().toUpperCase();
      setInputCode(code);
      setSessionCode(code);
      setScreen("moto");
      setStatus("Connexion à la régie…");
      localStorage.setItem('gpxrace_moto', code);

      let retryDelay = 3000; // délai initial 3s, double à chaque échec, max 30s

      // Tente de se connecter à la régie. Appelée à chaque reconnexion.
      const doConnect = (peer) => {
        if (!peer || peer.destroyed) return;
        const conn = peer.connect(`gpxrace-${code}`, { reliable:true });
        connRef.current = conn;

        const scheduleRetry = () => {
          setConnected(false);
          setStatus(`Perte réseau — nouvelle tentative dans ${Math.round(retryDelay/1000)}s…`);
          clearTimeout(retryTimerRef.current);
          retryTimerRef.current = setTimeout(() => {
            // Si PeerJS lui-même est déconnecté du serveur, le reconnecter d'abord
            if (peerRef.current && !peerRef.current.destroyed) {
              if (peerRef.current.disconnected) {
                peerRef.current.reconnect(); // open se déclenchera à nouveau
              } else {
                doConnect(peerRef.current);
              }
            }
          }, retryDelay);
          retryDelay = Math.min(retryDelay * 2, 30000);
        };

        conn.on("open", () => {
          retryDelay = 3000; // réinitialise le backoff après une connexion réussie
          setConnected(true);
          setStatus("Connectée — réception du tracé…");
        });

        conn.on("data", data => {
          if (data.type === "gpx" && data.track) {
            setGpxTrack(data.track);
            gpxRef.current = data.track;
            setGpxName(data.name || "Course");
            setTotalKm(data.track[data.track.length-1].cum);
            // Restaure la position sur la trace si la page a été rechargée
            const savedIdx = localStorage.getItem('gpxrace_moto_idx');
            if (savedIdx !== null) {
              const idx = parseInt(savedIdx);
              if (!isNaN(idx) && idx < data.track.length) trackIdxRef.current = idx;
            }
            setGpxReceived(true);
            setStatus("Tracé reçu ✓ — GPS actif");
            startGPS(); // ne démarre qu'une seule fois grâce au guard interne
          }
        });

        conn.on("close", scheduleRetry);
        conn.on("error", scheduleRetry);
      };

      const peer = new Peer();
      peerRef.current = peer;

      // Connexion initiale dès que PeerJS est prêt
      peer.on("open", () => doConnect(peer));

      // Si PeerJS perd sa connexion au serveur relais, il se reconnecte automatiquement
      // et "open" se redéclenche → doConnect appelé à nouveau
      peer.on("disconnected", () => {
        if (!peer.destroyed) peer.reconnect();
      });

      peer.on("error", err => {
        if (err.type === "peer-unavailable") {
          // La régie n'est pas encore démarrée : on réessaie
          setStatus(`Régie introuvable — nouvelle tentative dans ${Math.round(retryDelay/1000)}s…`);
          clearTimeout(retryTimerRef.current);
          retryTimerRef.current = setTimeout(() => doConnect(peerRef.current), retryDelay);
          retryDelay = Math.min(retryDelay * 2, 30000);
        } else {
          setStatus(`Erreur réseau: ${err.type}`);
        }
      });
    };

    // Reconnexion automatique si le téléphone a été rechargé (accidentellement)
    useEffect(() => {
      const savedCode = localStorage.getItem('gpxrace_moto');
      if (savedCode) startMoto(savedCode);
    }, []); // eslint-disable-line react-hooks/exhaustive-deps

    const progress = totalKm > 0 && remainingKm != null ? ((totalKm-remainingKm)/totalKm)*100 : 0;
    const doneKm   = totalKm - (remainingKm ?? totalKm);

    // ════════════════════════════════════════════════════════════════════════
    // SETUP
    // ════════════════════════════════════════════════════════════════════════
    if (screen === "setup") return (
      <div className="setup">
        <p className="logo">Cycling Broadcast</p>
        <h1 className="title">GPX Race Tracker</h1>
        <p className="subtitle">Retransmission directe · Kilomètres en temps réel</p>

        <div className="card">
          <p className="card-label">Nom de session — identique sur les deux appareils</p>
          <input
            className="code-input"
            style={{fontSize:22,padding:10,marginBottom:0}}
            value={inputCode}
            onChange={e=>setInputCode(e.target.value.toUpperCase().replace(/\s/g,""))}
            placeholder="ex: TOUR2025"
            maxLength={20}
          />
        </div>

        <div className="card">
          <p className="card-label">Régie uniquement — Fichier GPX de la course</p>
          <label className="upload-btn">
            <span style={{fontSize:24}}>📁</span>
            <div style={{flex:1}}>
              <p className="upload-name" style={{color:gpxName?"#94a3b8":"#475569"}}>{gpxName||"Charger un fichier .gpx"}</p>
              {totalKm>0 && <p className="upload-meta">{totalKm.toFixed(2)} km · {gpxTrack?.length?.toLocaleString()} points</p>}
            </div>
            <input type="file" accept=".gpx" style={{display:"none"}} onChange={handleGPX}/>
          </label>
          {gpxTrack && <div style={{marginTop:12}}><TrackMap track={gpxTrack} compact/></div>}
        </div>

        <p className="card-label" style={{color:"#334155",marginBottom:10}}>Choisissez votre rôle</p>
        <div className="modes">
          <button className="mode-btn primary" onClick={startRegie} disabled={!gpxTrack||!inputCode.trim()}>
            <span className="mode-icon">📺</span>
            <span className="mode-title">Régie</span>
            <span className="mode-desc">Charge le GPX · Affiche les km</span>
          </button>
          <button className="mode-btn" onClick={() => startMoto()} disabled={!inputCode.trim()}>
            <span className="mode-icon">🏍️</span>
            <span className="mode-title">Moto</span>
            <span className="mode-desc">GPS automatique · Rien à charger</span>
          </button>
        </div>

        {status && <p className="status-msg">{status}</p>}
        <p style={{fontSize:11,color:"#1e2d45",marginTop:20,letterSpacing:"0.1em"}}>
          vMix data source : ouvrir <strong style={{color:"#334155"}}>index.html?vmix</strong> dans un onglet régie
        </p>
      </div>
    );

    // ════════════════════════════════════════════════════════════════════════
    // RÉGIE LIVE
    // ════════════════════════════════════════════════════════════════════════
    if (screen === "regie") return (
      <div className="display">
        <div className="topbar">
          <button className="back-btn" onClick={goBack}>← Retour</button>
          <div className="conn-badge">
            <div className={`dot ${connected?"green":"gray"}`}/>
            <span>{connected ? "Moto connectée" : status||"En attente…"}</span>
          </div>
        </div>

        {!connected && (
          <div className="code-display" style={{marginBottom:16}}>
            <p className="code-label">Code à donner à la moto</p>
            <p className="code-value">{sessionCode}</p>
            <p className="code-hint">{peerReady ? "En attente de connexion…" : "Initialisation…"}</p>
          </div>
        )}

        <p className="race-name">{gpxName}</p>

        <div className="km-display">
          {remainingKm != null ? (
            <>
              <p className="km-number">{remainingKm.toFixed(1)}</p>
              <p className="km-unit">km restants</p>
            </>
          ) : (
            <p className="km-waiting">{connected?"Acquisition GPS…":"En attente de la moto…"}</p>
          )}

          {totalKm > 0 && (
            <div className="progress-wrap" style={{marginTop:24}}>
              <div className="progress-meta">
                <span>Départ</span>
                <span>{doneKm.toFixed(2)} / {totalKm.toFixed(2)} km</span>
                <span>Arrivée</span>
              </div>
              <div className="progress-bar">
                <div className="progress-fill" style={{width:`${Math.min(100,progress)}%`}}/>
              </div>
              <p className="progress-pct">{progress.toFixed(1)}% parcouru</p>
            </div>
          )}

          <div style={{marginTop:16}}><TrackMap track={gpxTrack} currentPos={currentPos}/></div>
          {accuracy!=null && <p className="gps-acc-display" style={{marginTop:8}}>GPS ±{accuracy.toFixed(0)} m</p>}
        </div>
      </div>
    );

    // ════════════════════════════════════════════════════════════════════════
    // MOTO
    // ════════════════════════════════════════════════════════════════════════
    if (screen === "moto") return (
      <div className="screen">
        <button className="back-btn" onClick={goBack}>← Retour</button>

        <div style={{textAlign:"center"}}>
          <p style={{fontSize:11,color:"#334155",letterSpacing:"0.2em",textTransform:"uppercase"}}>Mode Moto Caméra</p>
          <p style={{fontSize:18,fontWeight:700,color:"#94a3b8",marginTop:2}}>
            {gpxReceived ? gpxName : "Connexion en cours…"}
          </p>
        </div>

        <div className="status-pill">
          <div className={`dot ${connected && gpxReceived?"green":connected?"yellow":"gray"}`}/>
          <span style={{color:connected&&gpxReceived?"#22c55e":connected?"#f59e0b":"#475569"}}>
            {status||(connected?"Connectée…":"Connexion…")}
          </span>
        </div>

        {gpxReceived && currentPos && (
          <div className="gps-card">
            <p className="gps-label">Signal GPS</p>
            <p className="gps-coords">{currentPos.lat.toFixed(5)}, {currentPos.lon.toFixed(5)}</p>
            {accuracy!=null && <p className="gps-acc">Précision : ±{accuracy.toFixed(0)} m</p>}
            {remainingKm!=null && <p className="km-local">{remainingKm.toFixed(1)} km restants</p>}
          </div>
        )}

        {gpxReceived && <TrackMap track={gpxTrack} currentPos={currentPos} compact/>}

        {gpxReceived && (
          <p style={{fontSize:11,color:"#1e2d45",letterSpacing:"0.1em"}}>
            Mise à jour tous les 100 m · {totalKm.toFixed(1)} km au total
          </p>
        )}
      </div>
    );
  }

  // ── Point d'entrée ────────────────────────────────────────────────────────
  const isVmix = new URLSearchParams(window.location.search).has('vmix');
  ReactDOM.createRoot(document.getElementById("root")).render(
    isVmix ? <VmixDisplay/> : <App/>
  );
</script>
</body>
</html>
